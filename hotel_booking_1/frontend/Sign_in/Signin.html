<!DOCTYPE html>

<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - LeeMinHon</title>
    <link rel="stylesheet" href="Signin.css">
    <link rel="stylesheet" href="../Theme.css">
</head>
<body>
    <main class="signin-container">
        <form id="signinForm" class="signin-card">
            <h1>Chào mừng bạn quay trở lại!</h1>
            <p>Đăng nhập vào tài khoản của bạn</p>

            <label for="email">Email</label>
            <input type="email" id="email" name="email"
                   placeholder="Nhập địa chỉ email" required>



            <label for="password">Mật khẩu</label>

            <div class="password-wrapper">
                <input type="password" 
                       id="password" 
                       name="password"
                       placeholder="Nhập mật khẩu" 
                       required
                >
            </div>

            <div class="signin-options">
                <a href="#" id="forgotLink">Quên mật khẩu?</a>
            </div>


            <button type="submit">Đăng nhập</button>

            <p id="message" role="status"></p>

            <p class="signup-link">
                Bạn chưa có tài khoản?
                <a href="../Sign_up/Signup.html">Đăng ký</a>
            </p>

            <a class="back-home" href="../Home/Home.html">← Quay về trang chủ</a>
        </form>
    </main>

    <script src="Signin.js"></script>

    <script src="../auth.js"></script>
</body>
</html>
